
map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }
 upstream glc_iis_backend {
        server 192.168.1.66:8888;
        keepalive 32;
    }
server {
    listen 80;
    server_name glc.aigreetings.vn www.glc.aigreetings.vn;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri $uri/ =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name glc.aigreetings.vn www.glc.aigreetings.vn;

    ssl_certificate     /etc/letsencrypt/live/glc.aigreetings.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/glc.aigreetings.vn/privkey.pem;

    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Permissions-Policy;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self' https://glc.aigreetings.vn https://www.glc.aigreetings.vn; img-src 'self' data: blob: https:; font-src 'self' data: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.>
    add_header Permissions-Policy "xr-spatial-tracking=()" always;

    location /_blazor {
        proxy_pass http://glc_iis_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location / {
        proxy_pass http://glc_iis_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}

